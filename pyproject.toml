[project]
name = "image-sanitiser"
version = "0.1.0"
description = "Detection-assisted image redaction studio for Linux — find QR codes, faces and PII in photos, obfuscate them, and verify they're gone."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.7",
    "opencv-python>=4.9",
    "numpy>=1.26",
    "pillow>=10.0",
    # zbar engine (as used by qrpyora-blur); needs system libzbar0 — the
    # detector stack skips it cleanly if the shared library is missing.
    "pyzbar>=0.1.9",
]

[project.optional-dependencies]
# YOLOv8-based QR detection (qreader). Much better recall on rotated/small/
# damaged codes than the built-in OpenCV detector, but pulls in torch.
qr-ml = ["qreader>=3.12"]
ocr = ["pytesseract>=0.3.10"]
gcv = ["google-cloud-vision>=3.7"]
dev = ["pytest>=8.0", "qrcode[pil]>=7.4"]

[project.scripts]
image-sanitiser = "image_sanitiser.gui.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/image_sanitiser"]

[tool.pytest.ini_options]
testpaths = ["tests"]
